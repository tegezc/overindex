# Superseded 2026-10-20. Hosting is Compute Engine e2-micro (docs decision D-025).
# This file is not the deploy plan. Do not run fly deploy from it.
# QLOO_API_KEY and OPENAI_API_KEY are not entries in this file.

app = "overindex"
primary_region = "sin"

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  CACHE_DIR = "/data"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "45s"
    timeout = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[mounts]]
  source = "overindex_data"
  destination = "/data"
  initial_size = "1gb"
